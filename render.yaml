# Deploy automático a partir do GitHub no Render:
# 1) Crie conta em https://render.com
# 2) Dashboard → New → Blueprint → conecte o repo gelvano73/Barbearia
# 3) Aplique este arquivo (render.yaml)
#
# URLs esperadas (podem variar levemente na conta):
#   API:  https://barbearia-api.onrender.com
#   Site: https://barbearia-web.onrender.com

databases:
  - name: barbearia-db
    plan: free

services:
  - type: web
    name: barbearia-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /v3/api-docs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: barbearia-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: "86400000"
      - key: CORS_ALLOWED_ORIGINS
        value: https://barbearia-web.onrender.com
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: BACKUP_ENABLED
        value: "false"
      - key: OAUTH_DEV_MODE
        value: "true"

  - type: web
    name: barbearia-web
    runtime: static
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        value: https://barbearia-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
