# Blueprint Render — deploy a partir do GitHub
# https://dashboard.render.com/blueprints
#
# IMPORTANTE: use estes nomes novos (os antigos barbearia-web/api estavam
# vazios ou com app errado no Render).
#
# URLs após o deploy:
#   Site: https://barbearia-saas-web.onrender.com
#   API:  https://barbearia-saas-api.onrender.com

databases:
  - name: barbearia-saas-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: barbearia-saas-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /v3/api-docs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: barbearia-saas-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: "86400000"
      - key: CORS_ALLOWED_ORIGINS
        value: https://barbearia-saas-web.onrender.com
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: BACKUP_ENABLED
        value: "false"
      - key: OAUTH_DEV_MODE
        value: "true"

  - type: web
    name: barbearia-saas-web
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: VITE_API_URL
        value: https://barbearia-saas-api.onrender.com/api
