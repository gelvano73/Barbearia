spring:
  application:
    name: barbearia-saas
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/barbearia_saas}
    username: ${SPRING_DATASOURCE_USERNAME:barbearia}
    password: ${SPRING_DATASOURCE_PASSWORD:barbearia123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: America/Sao_Paulo
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8080}
  error:
    include-message: ${ERROR_INCLUDE_MESSAGE:never}

app:
  jwt:
    secret: ${JWT_SECRET:4f8c2e1a9b7d6e5f3a2c1b0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  oauth:
    dev-mode: ${OAUTH_DEV_MODE:false}
  upload:
    dir: ${UPLOAD_DIR:uploads}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:no-reply@barbearia.app}
  security:
    expose-dev-tokens: ${EXPOSE_DEV_TOKENS:false}
  assinatura:
    trial-dias: ${ASSINATURA_TRIAL_DIAS:14}
  storage:
    provider: ${STORAGE_PROVIDER:local}
    dir: ${UPLOAD_DIR:uploads}
    s3-endpoint: ${STORAGE_S3_ENDPOINT:}
    s3-region: ${STORAGE_S3_REGION:us-east-1}
    s3-bucket: ${STORAGE_S3_BUCKET:}
    s3-access-key: ${STORAGE_S3_ACCESS_KEY:}
    s3-secret-key: ${STORAGE_S3_SECRET_KEY:}
    s3-public-base-url: ${STORAGE_S3_PUBLIC_BASE_URL:}
  mercadopago:
    enabled: ${MERCADOPAGO_ENABLED:false}
    access-token: ${MERCADOPAGO_ACCESS_TOKEN:}
    webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET:}
    public-key: ${MERCADOPAGO_PUBLIC_KEY:}
    notification-url: ${MERCADOPAGO_NOTIFICATION_URL:}
    allow-simulated: ${MERCADOPAGO_ALLOW_SIMULATED:false}
  backup:
    enabled: ${BACKUP_ENABLED:true}
    cron: ${BACKUP_CRON:0 0 3 * * *}
    dir: ${BACKUP_DIR:backups}
    retention-days: ${BACKUP_RETENTION_DAYS:7}
  ai:
    enabled: ${AI_ENABLED:true}
    provider: ${AI_PROVIDER:rule-engine}
    openai-api-key: ${OPENAI_API_KEY:}
    openai-model: ${OPENAI_MODEL:gpt-4o-mini}
  whatsapp:
    enabled: ${WHATSAPP_ENABLED:true}
    verify-token: ${WHATSAPP_VERIFY_TOKEN:barbearia-whatsapp-dev}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    app-secret: ${WHATSAPP_APP_SECRET:}
    default-barbearia-id: ${WHATSAPP_BARBEARIA_ID:1}
    simular-envio: ${WHATSAPP_SIMULAR:true}
  nfse:
    enabled: ${NFSE_ENABLED:false}
    token: ${NFSE_TOKEN:}
    ambiente: ${NFSE_AMBIENTE:homologacao}
    base-url-homologacao: ${NFSE_BASE_URL_HOMOLOG:https://homologacao.focusnfe.com.br}
    base-url-producao: ${NFSE_BASE_URL_PROD:https://api.focusnfe.com.br}
    rejeitar-cpf-exemplo: ${NFSE_REJEITAR_CPF_EXEMPLO:true}
    auto-emitir: ${NFSE_AUTO_EMITIR:true}
  email:
    validar-dns: ${EMAIL_VALIDAR_DNS:true}
    dns-timeout-ms: ${EMAIL_DNS_TIMEOUT_MS:2500}
    dns-cache-minutos: ${EMAIL_DNS_CACHE_MINUTOS:60}

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:${SPRING_PROFILES_ACTIVE:local}}
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.1}
  send-default-pii: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    com.barbearia.saas: INFO
    org.springframework.security: WARN
