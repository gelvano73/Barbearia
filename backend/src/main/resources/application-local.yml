spring:
  datasource:
    url: jdbc:h2:file:./data/barbearia;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

app:
  jwt:
    secret: local-dev-secret-key-with-32-bytes-min
    expiration-ms: 86400000
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:5175,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175
  oauth:
    dev-mode: true
  upload:
    dir: uploads
  backup:
    enabled: true
    cron: "0 0 3 * * *"
    dir: backups
    retention-days: 7
  ai:
    enabled: true
    provider: rule-engine
  whatsapp:
    enabled: true
    verify-token: barbearia-whatsapp-dev
    default-barbearia-id: 1
    simular-envio: true

logging:
  level:
    com.barbearia.saas: INFO
