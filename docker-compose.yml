services:
  postgres:
    image: postgres:16-alpine
    container_name: barbearia-postgres
    environment:
      POSTGRES_DB: barbearia_saas
      POSTGRES_USER: barbearia
      POSTGRES_PASSWORD: barbearia123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barbearia -d barbearia_saas"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: barbearia-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/barbearia_saas
      SPRING_DATASOURCE_USERNAME: barbearia
      SPRING_DATASOURCE_PASSWORD: barbearia123
      JWT_SECRET: 4f8c2e1a9b7d6e5f3a2c1b0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f
      JWT_EXPIRATION_MS: "86400000"
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      UPLOAD_DIR: /app/uploads
      BACKUP_DIR: /app/backups
      BACKUP_ENABLED: "true"
      BACKUP_CRON: "0 0 3 * * *"
      BACKUP_RETENTION_DAYS: "7"
      LOG_PATH: /app/logs
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads
      - backup_data:/app/backups
      - logs_data:/app/logs
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: barbearia-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  # Backup diário: pg_dump + uploads (sidecar)
  backup:
    image: postgres:16-alpine
    container_name: barbearia-backup
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: barbearia123
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: barbearia
      PGDATABASE: barbearia_saas
      BACKUP_DIR: /backups
      UPLOADS_DIR: /uploads
      RETENTION_DAYS: "7"
      TZ: America/Sao_Paulo
    volumes:
      - uploads_data:/uploads:ro
      - backup_data:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        chmod +x /backup.sh
        echo "[backup] Serviço iniciado — ciclo a cada 24h"
        while true; do
          /backup.sh || echo "[backup] Falha no ciclo"
          sleep 86400
        done
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
  backup_data:
  logs_data:
