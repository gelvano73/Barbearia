name: Deploy Railway

# Deploy automático após CI verde na main.
# Secrets necessários: RAILWAY_TOKEN, RAILWAY_SERVICE_API, RAILWAY_SERVICE_WEB
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Railway CLI
        run: npm i -g @railway/cli
      - name: Deploy API e Web
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_API: ${{ secrets.RAILWAY_SERVICE_API }}
          RAILWAY_SERVICE_WEB: ${{ secrets.RAILWAY_SERVICE_WEB }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "RAILWAY_TOKEN não configurado — pulando deploy."
            exit 0
          fi
          if [ -n "$RAILWAY_SERVICE_API" ]; then
            railway up --service "$RAILWAY_SERVICE_API" --detach -c backend
          fi
          if [ -n "$RAILWAY_SERVICE_WEB" ]; then
            railway up --service "$RAILWAY_SERVICE_WEB" --detach -c frontend
          fi
